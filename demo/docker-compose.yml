# Demo con contenedores: cinco organizaciones, cada una un agente detector de intrusiones.
#
#   A  conoce el ataque nuevo y ofrece a sus pares el modelo de la federación.
#   B, C y D  nunca vieron ese ataque.
#   E  es maliciosa: entrenó con las etiquetas invertidas y ofrece ese modelo.
#
# Un contenedor más (el panel o el atacante) les envía tráfico. Instrucciones en demo/README.md.
#
# Variables opcionales:
#   FAMILIA (PortScan), MODELO (mlp), DIR_MODELOS (carpeta con los .pt y .csv)
#   OFRECE_A: archivo que ofrece A. Con e3_mlp_PortScan_federado.pt se ve la federación sin máscara.

x-nodo: &nodo
  build:
    context: ..
    dockerfile: demo/Dockerfile
  image: ciber-inmunologia-demo
  volumes:
    - ${DIR_MODELOS:-../experiments/resultados/modelos}:/modelos:ro   # solo lectura

x-panel: &panel
  FAMILIA: ${FAMILIA:-PortScan}
  NODOS: nodo-a,nodo-b,nodo-c,nodo-d,nodo-e
  ESPECIALISTA: nodo-a
  MALICIOSO: nodo-e

services:
  nodo-a:
    <<: *nodo
    environment:
      NOMBRE: Organización A
      DIRECCION: nodo-a
      PARES: nodo-b,nodo-c,nodo-d,nodo-e
      PESOS: e3_${MODELO:-mlp}_${FAMILIA:-PortScan}_aislado_nodo0.pt
      VALIDACION: e3_${FAMILIA:-PortScan}_validacion_nodo0.csv
      OFRECE: ${OFRECE_A:-e3_${MODELO:-mlp}_${FAMILIA:-PortScan}_federado_mascara.pt}
  nodo-b:
    <<: *nodo
    environment:
      NOMBRE: Organización B
      DIRECCION: nodo-b
      PARES: nodo-a,nodo-c,nodo-d,nodo-e
      PESOS: e3_${MODELO:-mlp}_${FAMILIA:-PortScan}_aislado_nodo1.pt
      VALIDACION: e3_${FAMILIA:-PortScan}_validacion_nodo1.csv
  nodo-c:
    <<: *nodo
    environment:
      NOMBRE: Organización C
      DIRECCION: nodo-c
      PARES: nodo-a,nodo-b,nodo-d,nodo-e
      PESOS: e3_${MODELO:-mlp}_${FAMILIA:-PortScan}_aislado_nodo2.pt
      VALIDACION: e3_${FAMILIA:-PortScan}_validacion_nodo2.csv
  nodo-d:
    <<: *nodo
    environment:
      NOMBRE: Organización D
      DIRECCION: nodo-d
      PARES: nodo-a,nodo-b,nodo-c,nodo-e
      PESOS: e3_${MODELO:-mlp}_${FAMILIA:-PortScan}_aislado_nodo3.pt
      VALIDACION: e3_${FAMILIA:-PortScan}_validacion_nodo3.csv
  nodo-e:
    <<: *nodo
    environment:
      NOMBRE: Organización E
      DIRECCION: nodo-e
      PARES: nodo-a,nodo-b,nodo-c,nodo-d
      PESOS: e3_${MODELO:-mlp}_${FAMILIA:-PortScan}_envenenado.pt
      VALIDACION: e3_${FAMILIA:-PortScan}_validacion_nodo4.csv
      OFRECE: e3_${MODELO:-mlp}_${FAMILIA:-PortScan}_envenenado.pt

  # Panel web: http://localhost:8080
  panel:
    <<: *nodo
    command: python -u -m demo.panel
    ports: ["8080:8000"]
    environment: *panel
    depends_on: [nodo-a, nodo-b, nodo-c, nodo-d, nodo-e]

  # Versión de terminal del panel. No arranca con "up": se lanza a mano con "docker compose run --rm atacante"
  atacante:
    <<: *nodo
    profiles: [ataque]
    command: python -u -m demo.ataque
    environment: *panel
    depends_on: [nodo-a, nodo-b, nodo-c, nodo-d, nodo-e]
