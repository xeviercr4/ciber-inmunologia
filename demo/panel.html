<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo zero-day</title>
<style>
  :root {
    --fondo: #f5f4f1; --tarjeta: #fcfcfb; --borde: #dddbd5; --texto: #1f1e1c; --suave: #6b6a65;
    --vacio: #e6e4de; --reconoce: #1baf7a; --otro: #2a78d6; --pasa: #eb6834; --normal: #b9b7b0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #121211; --tarjeta: #1a1a19; --borde: #34332f; --texto: #eceae4; --suave: #a3a19a;
            --vacio: #2a2927; --reconoce: #199e70; --otro: #3987e5; --pasa: #d95926; --normal: #5d5b56; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px 48px; background: var(--fondo); color: var(--texto);
         font: 16px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--suave); max-width: 70ch; }
  .controles { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; }
  .fases { display: flex; flex-wrap: wrap; border: 1px solid var(--borde); border-radius: 8px; overflow: hidden; }
  button { font: inherit; color: var(--texto); background: var(--tarjeta); border: 0; padding: 10px 16px; cursor: pointer; }
  .fases button + button { border-left: 1px solid var(--borde); }
  .fases button[aria-pressed="true"] { background: var(--texto); color: var(--fondo); }
  #enviar { border-radius: 8px; background: var(--pasa); color: #fff; font-weight: 600; padding: 10px 22px; }
  button:disabled { opacity: .5; cursor: default; }
  #mensaje { min-height: 48px; margin: 8px 0 16px; font-size: 18px; }
  .nodos { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 16px; }
  .nodo { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 16px; }
  .nodo h2 { font-size: 18px; margin: 0; }
  .pesos { font: 12px ui-monospace, Menlo, monospace; color: var(--suave); margin: 2px 0 12px; word-break: break-all; }
  .rotulo { font-size: 13px; color: var(--suave); margin: 10px 0 6px; }
  .grilla { display: grid; grid-template-columns: repeat(30, 1fr); gap: 2px; }
  .grilla i { aspect-ratio: 1; border-radius: 2px; background: var(--vacio); transition: background .15s; }
  i.reconoce { background: var(--reconoce); } i.otro { background: var(--otro); }
  i.pasa { background: var(--pasa); } i.normal { background: var(--normal); }
  .cifras { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 14px; }
  .cifras b { font-variant-numeric: tabular-nums; }
  .punto { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .leyenda { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 20px 0 8px; font-size: 14px; color: var(--suave); }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 15px; }
  th, td { text-align: right; padding: 8px 10px; border-bottom: 1px solid var(--borde); font-variant-numeric: tabular-nums; }
  th:first-child, td:first-child { text-align: left; }
  th { font-weight: 600; color: var(--suave); font-size: 13px; }
  .tabla { overflow-x: auto; }
  h3 { font-size: 16px; margin: 28px 0 0; }
</style>
</head>
<body>
<main>
  <h1>Un ataque nuevo contra tres organizaciones</h1>
  <p class="sub" id="sub"></p>

  <div class="controles">
    <div class="fases" id="fases"></div>
    <button id="enviar">Enviar tráfico</button>
  </div>
  <div id="mensaje"></div>

  <div class="nodos" id="nodos"></div>

  <div class="leyenda">
    <span><span class="punto" style="background:var(--reconoce)"></span>Reconoce el ataque nuevo</span>
    <span><span class="punto" style="background:var(--otro)"></span>Da alarma, con otro nombre</span>
    <span><span class="punto" style="background:var(--pasa)"></span>Lo deja pasar / falsa alarma</span>
    <span><span class="punto" style="background:var(--normal)"></span>Tráfico normal bien clasificado</span>
  </div>

  <h3>Resultados de cada fase</h3>
  <div class="tabla"><table>
    <thead><tr><th>Fase</th><th>Reconocidos</th><th>Con otro nombre</th><th>Pasaron como normales</th><th>Falsas alarmas</th></tr></thead>
    <tbody id="resumen"></tbody>
  </table></div>
</main>

<script>
const LOTE = 15;        // flujos por envío: con lotes chicos se ve cómo se va llenando la grilla
const PAUSA_MS = 120;   // pausa entre envíos
const EXPLICACION = [
  "Cada organización usa el modelo que entrenó solo con sus datos. Ninguna vio este ataque.",
  "Las organizaciones federan con promedio simple. Cuatro de cinco nunca vieron el ataque y su voto tapa al de la que sí lo vio.",
  "Las organizaciones federan con máscara de clases: cada una opina solo sobre las familias que conoce.",
];
let info = null, fase = 1, ocupado = false;
const $ = id => document.getElementById(id);
const resultados = {};  // fase -> conteos

async function pedir(ruta, datos) {
  const r = await fetch(ruta, datos ? {method: "POST", body: JSON.stringify(datos)} : undefined);
  const cuerpo = await r.json();
  if (cuerpo.error) throw new Error(cuerpo.error);
  return cuerpo;
}

function dibujarNodos() {
  $("nodos").innerHTML = info.nodos.map((n, k) => `
    <section class="nodo">
      <h2>${n.nombre}</h2>
      <div class="pesos">${n.pesos}</div>
      <div class="rotulo">${info.flujos_ataque} flujos de ${info.familia}</div>
      <div class="grilla" id="a${k}">${"<i></i>".repeat(info.flujos_ataque)}</div>
      <div class="cifras" id="ca${k}"></div>
      <div class="rotulo">${info.flujos_normales} flujos normales</div>
      <div class="grilla" id="n${k}">${"<i></i>".repeat(info.flujos_normales)}</div>
      <div class="cifras" id="cn${k}"></div>
    </section>`).join("");
}

function dibujarFases() {
  $("fases").innerHTML = info.fases.map((t, k) =>
    `<button data-fase="${k + 1}" aria-pressed="${fase === k + 1}">${k + 1}. ${t}</button>`).join("");
  $("mensaje").textContent = EXPLICACION[fase - 1];
}

function dibujarResumen() {
  const pct = (a, b) => `${a} (${Math.round(100 * a / b)}%)`;
  $("resumen").innerHTML = info.fases.map((t, k) => {
    const r = resultados[k + 1];
    if (!r) return `<tr><td>${k + 1}. ${t}</td><td colspan="4" style="text-align:center">sin correr</td></tr>`;
    return `<tr><td>${k + 1}. ${t}</td><td>${pct(r.reconoce, r.ataque)}</td><td>${pct(r.otro, r.ataque)}</td>
            <td>${pct(r.pasa, r.ataque)}</td><td>${pct(r.falsas, r.normal)}</td></tr>`;
  }).join("");
}

async function elegirFase(numero) {
  if (ocupado) return;
  fase = numero;
  info = await pedir("/api/fase", {numero});
  dibujarFases(); dibujarNodos();
}

async function enviar() {
  if (ocupado) return;
  ocupado = true; $("enviar").disabled = true;
  dibujarNodos();
  const total = {reconoce: 0, otro: 0, pasa: 0, falsas: 0, ataque: 0, normal: 0};
  const porNodo = info.nodos.map(() => ({reconoce: 0, otro: 0, pasa: 0, falsas: 0, bien: 0}));
  const maximo = Math.max(info.flujos_ataque, info.flujos_normales);
  try {
    for (let desde = 0; desde < maximo; desde += LOTE) {
      const lote = await pedir("/api/atacar", {desde, hasta: desde + LOTE});
      lote.nodos.forEach((nodo, k) => {
        const c = porNodo[k];
        nodo.ataque.forEach((familia, j) => {
          const clase = familia === info.familia ? "reconoce" : familia === "Benign" ? "pasa" : "otro";
          $("a" + k).children[desde + j].className = clase; c[clase]++; total[clase]++; total.ataque++;
        });
        nodo.normal.forEach((familia, j) => {
          const bien = familia === "Benign";
          $("n" + k).children[desde + j].className = bien ? "normal" : "pasa";
          bien ? c.bien++ : (c.falsas++, total.falsas++); total.normal++;
        });
        $("ca" + k).innerHTML = `<span>Reconoce: <b>${c.reconoce}</b></span><span>Otro nombre: <b>${c.otro}</b></span><span>Deja pasar: <b>${c.pasa}</b></span>`;
        $("cn" + k).innerHTML = `<span>Falsas alarmas: <b>${c.falsas}</b></span>`;
      });
      await new Promise(listo => setTimeout(listo, PAUSA_MS));
    }
    resultados[fase] = total;
    dibujarResumen();
    const parte = Math.round(100 * total.reconoce / total.ataque);
    $("mensaje").textContent = parte >= 90
      ? `Los tres nodos reconocen el ataque (${parte}% de los flujos) sin haberlo visto nunca en sus datos.`
      : `El ataque pasa: solo se reconoce el ${parte}% de los flujos y ${total.pasa} de ${total.ataque} se toman por tráfico normal.`;
  } catch (error) {
    $("mensaje").textContent = "Error: " + error.message;
  }
  ocupado = false; $("enviar").disabled = false;
}

$("fases").addEventListener("click", e => { if (e.target.dataset.fase) elegirFase(+e.target.dataset.fase); });
$("enviar").addEventListener("click", enviar);

(async () => {
  info = await pedir("/api/estado");
  $("sub").textContent = `El ataque nuevo es ${info.familia}. Solo la organización A lo tiene en sus datos; B, C y D ` +
    `nunca lo vieron. Cada cuadrado es un flujo de red del conjunto de prueba, clasificado por el contenedor de ese nodo.`;
  // ?auto=N corre la fase N sin tocar nada (sirve para revisar la página con una captura)
  const auto = +new URLSearchParams(location.search).get("auto");
  await elegirFase(auto || 1); dibujarResumen();
  if (auto) enviar();
})();
</script>
</body>
</html>
